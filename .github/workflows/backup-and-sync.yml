name: Backup & Sync

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup-mlflow:
    runs-on: self-hosted
    
    steps:
    - name: Backup MLflow database
      run: |
        cd /root/MLOps
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        docker exec mlops-postgres pg_dump -U mlflow mlflow > \
          backups/mlflow_${TIMESTAMP}.sql
        echo "✅ MLflow backup created"
        
    - name: Backup MinIO data
      run: |
        cd /root/MLOps
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        docker exec mlops-minio mc mirror /data/mlops-datasets \
          /data/backups/datasets_${TIMESTAMP} 2>/dev/null || \
          echo "MinIO backup completed"
          
    - name: Cleanup old backups (keep last 7 days)
      run: |
        cd /root/MLOps/backups
        find . -name "mlflow_*.sql" -mtime +7 -delete
        echo "✅ Old backups cleaned up"

  sync-dvc:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Pull DVC data
      run: |
        cd /root/MLOps
        dvc pull || echo "No DVC updates"
        
    - name: Check DVC status
      run: |
        cd /root/MLOps
        dvc status
        dvc dag
