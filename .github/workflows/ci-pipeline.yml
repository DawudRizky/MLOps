name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pytest pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stop build if syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check code formatting with black
      run: |
        black --check src/
        
    - name: Run tests
      run: |
        pytest src/ -v --tb=short || echo "No tests found"

  validate-docker-compose:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate docker-compose
      run: |
        docker compose -f docker-compose.yml config > /dev/null
        echo "✅ docker-compose.yml is valid"
        
    - name: Check DAG syntax
      run: |
        python -m py_compile airflow/dags/*.py
        echo "✅ All DAG files have valid syntax"

  build-docker-images:
    runs-on: self-hosted
    needs: [code-quality, validate-docker-compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker images
      run: |
        echo "Building Docker images..."
        docker build -t mlops-api:latest -f infrastructure/Dockerfile.api .
        docker build -t mlops-scraper:latest -f infrastructure/Dockerfile.scraper .
        docker build -t mlops-trainer:latest -f infrastructure/Dockerfile.trainer .
        docker build -t mlops-ingest:latest -f infrastructure/Dockerfile.ingest .
        
    - name: Tag images with commit SHA
      run: |
        export SHORT_SHA=$(git rev-parse --short HEAD)
        docker tag mlops-api:latest mlops-api:$SHORT_SHA
        docker tag mlops-scraper:latest mlops-scraper:$SHORT_SHA
        docker tag mlops-trainer:latest mlops-trainer:$SHORT_SHA
        docker tag mlops-ingest:latest mlops-ingest:$SHORT_SHA
        echo "✅ Images tagged with $SHORT_SHA"
