# Prometheus Configuration
# Scrapes metrics from all services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mlops-pemerintah-tracker'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Container metrics - cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Host system metrics - Node Exporter
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 15s

  # FastAPI Backend (Blue)
  - job_name: 'api-blue'
    static_configs:
      - targets: ['mlops-api-blue:8000']
        labels:
          service: 'api'
          deployment: 'blue'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # MinIO Object Storage
  - job_name: 'minio'
    static_configs:
      - targets: ['mlops-minio:9000']
        labels:
          service: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s

  # MLflow Server
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlops-mlflow:5000']
        labels:
          service: 'mlflow'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Airflow Webserver (if metrics enabled)
  - job_name: 'airflow-webserver'
    static_configs:
      - targets: ['airflow-webserver:8080']
        labels:
          service: 'airflow-webserver'
    metrics_path: '/admin/metrics'
    scrape_interval: 30s

  # Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['mlops-grafana:3000']
        labels:
          service: 'grafana'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Loki self-monitoring
  - job_name: 'loki'
    static_configs:
      - targets: ['mlops-loki:3100']
        labels:
          service: 'loki'
    metrics_path: '/metrics'
    scrape_interval: 30s
