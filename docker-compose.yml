version: '3.8'

networks:
  mlops-network:
    driver: bridge

volumes:
  minio-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

services:
  # ===================================
  # STORAGE: MinIO (S3-Compatible)
  # ===================================
  minio:
    image: minio/minio:latest
    container_name: mlops-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.08'
          memory: 512M
        reservations:
          memory: 256M

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      
      echo 'Creating MinIO buckets...';
      
      # Create actual buckets (not folder-like paths)
      mc mb --ignore-existing minio/mlops-data;
      mc mb --ignore-existing minio/mlops-models;
      
      echo 'Buckets created: mlops-data, mlops-models';
      
      # Note: Folders (raw/, processed/, metadata/, etc.) are automatically 
      # created when objects are uploaded. No need to pre-create them.
      # This is the correct MinIO/S3 behavior.
      
      # Optional: Set public download ONLY for MLflow artifacts (use with caution in production)
      # mc anonymous set download minio/mlops-data/mlflow-artifacts;
      
      echo 'MinIO initialization complete!';
      echo 'Available buckets:';
      mc ls minio/;
      
      exit 0;
      "
    networks:
      - mlops-network

  # ===================================
  # DATABASE: PostgreSQL (MLflow Backend)
  # ===================================
  postgres:
    image: postgres:15-alpine
    container_name: mlops-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.08'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # CACHE: Redis
  # ===================================
  redis:
    image: redis:7-alpine
    container_name: mlops-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 256M
        reservations:
          memory: 128M

  # ===================================
  # DATABASE ADMIN: pgAdmin
  # ===================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mlops-pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    profiles:
      - admin  # Optional - start with: docker compose --profile admin up
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # MLFLOW: Experiment Tracking
  # ===================================
  mlflow:
    image: python:3.11-slim
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEFAULT_ARTIFACT_ROOT: s3://${MINIO_BUCKET_NAME}/mlflow-artifacts
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./infrastructure/init-scripts/install-mlflow.sh:/install-mlflow.sh
      - ./infrastructure/init-scripts/start-mlflow.sh:/start-mlflow.sh
    command: >
      bash -c "
      chmod +x /install-mlflow.sh /start-mlflow.sh &&
      /install-mlflow.sh &&
      /start-mlflow.sh
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # MONITORING: Prometheus
  # ===================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mlops-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/configs/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # ALERTING: AlertManager
  # ===================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: mlops-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.03'
          memory: 128M
        reservations:
          memory: 64M

  # ===================================
  # CONTAINER METRICS: cAdvisor
  # ===================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: mlops-cadvisor
    command:
      - '--housekeeping_interval=10s'
      - '--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process'
      - '--store_container_labels=true'
      - '--docker_only=false'
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 128M
        reservations:
          memory: 64M

  # ===================================
  # HOST METRICS: Node Exporter
  # ===================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: mlops-node-exporter
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.03'
          memory: 64M
        reservations:
          memory: 32M

  # ===================================
  # VISUALIZATION: Grafana
  # ===================================
  grafana:
    image: grafana/grafana:latest
    container_name: mlops-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Disable plugin installation to avoid network errors
      # GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/configs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./infrastructure/configs/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./infrastructure/configs/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 384M
        reservations:
          memory: 192M

  # ===================================
  # LOGGING: Loki
  # ===================================
  loki:
    image: grafana/loki:latest
    container_name: mlops-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/configs/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # LOG COLLECTION: Promtail
  # ===================================
  promtail:
    image: grafana/promtail:latest
    container_name: mlops-promtail
    depends_on:
      - loki
    volumes:
      - ./infrastructure/configs/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.03'
          memory: 128M
        reservations:
          memory: 64M

  # ===================================
  # API: FastAPI Backend (Blue)
  # ===================================
  api-blue:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.api
    container_name: mlops-api-blue
    ports:
      - "${BLUE_API_PORT:-8001}:8000"
    depends_on:
      - postgres
      - redis
      - mlflow
      - minio
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
    volumes:
      - ./src/api:/app/api
      - ./src/common:/app/common
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # API: FastAPI Backend (Green)
  # ===================================
  api-green:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.api
    container_name: mlops-api-green
    ports:
      - "${GREEN_API_PORT:-8002}:8000"
    depends_on:
      - postgres
      - redis
      - mlflow
      - minio
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
    volumes:
      - ./src/api:/app/api
      - ./src/common:/app/common
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - green  # Only start when explicitly enabled (skip to save resources)

  # ===================================
  # REVERSE PROXY: Nginx
  # ===================================
  nginx:
    image: nginx:alpine
    container_name: mlops-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - api-blue
      - dashboard-blue
    volumes:
      - ./infrastructure/configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/configs/nginx-blue.conf:/etc/nginx/conf.d/active.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.03'
          memory: 128M
        reservations:
          memory: 64M

  # ===================================
  # DASHBOARD: BERTopic Visualization Frontend (Blue)
  # ===================================
  dashboard-blue:
    build:
      context: /root/MLOps
      dockerfile: infrastructure/Dockerfile.dashboard
    container_name: mlops-dashboard-blue
    ports:
      - "${BLUE_DASHBOARD_PORT:-8003}:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EXPERIMENT_NAME: bertopic-pemerintah
      FLASK_ENV: production
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 512M
        reservations:
          memory: 256M

  # ===================================
  # DASHBOARD: BERTopic Visualization Frontend (Green)
  # ===================================
  dashboard-green:
    build:
      context: /root/MLOps
      dockerfile: infrastructure/Dockerfile.dashboard
    container_name: mlops-dashboard-green
    ports:
      - "${GREEN_DASHBOARD_PORT:-8004}:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EXPERIMENT_NAME: bertopic-pemerintah
      FLASK_ENV: production
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - green  # Only start when explicitly enabled

  # ===================================
  # SCRAPER: Twitter Data Collection
  # ===================================
  # NOTE: Use either 'scraper' (24/7 continuous) OR 'scheduler' (scheduled bursts)
  # For production, scheduler is RECOMMENDED for better anti-bot protection
  
  scraper:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.scraper
    container_name: mlops-scraper
    depends_on:
      - minio
      - redis
    environment:
      SERVICE_NAME: scraper
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_HOST: redisok
      REDIS_PORT: 6379
      TWITTER_COOKIES_FILE: /app/cookies.json
      TWITTER_SEARCH_QUERY: ${TWITTER_SEARCH_QUERY:-pemerintah}
      TWITTER_MAX_TWEETS: ${TWITTER_MAX_TWEETS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src/scraper:/app/scraper
      - ./src/common:/app/common
      - ./cookies.json:/app/cookies.json:ro
      - ./data/raw:/app/data/raw
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 512M
    profiles:
      - continuous  # Only start with: docker compose --profile continuous up

  # ===================================
  # SCHEDULER: Intelligent Scheduled Scraping (RECOMMENDED)
  # ===================================
  scheduler:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.scheduler
    container_name: mlops-scheduler
    depends_on:
      - minio
      - redis
    environment:
      SERVICE_NAME: scheduler
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TWITTER_COOKIES_FILE: /app/cookies.json
      TWITTER_SEARCH_QUERY: ${TWITTER_SEARCH_QUERY:-pemerintah}
      TWITTER_EXCLUDE_RETWEETS: ${TWITTER_EXCLUDE_RETWEETS:-true}
      TWITTER_EXCLUDE_REPLIES: ${TWITTER_EXCLUDE_REPLIES:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src/scheduler:/app/scheduler
      - ./src/scraper:/app/scraper
      - ./src/common:/app/common
      - ./cookies.json:/app/cookies.json:ro
      - ./data/raw:/app/data/raw
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for spawning containers
    networks:
      - mlops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 1G
        reservations:
          memory: 256M  # Lower when sleeping

  # ===================================
  # QUALITY GATE: Data Validation
  # ===================================
  # NOTE: This service is EPHEMERAL - spawned by scheduler when needed
  # Do not start manually unless testing
  quality-gate:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.quality-gate
    container_name: mlops-quality-gate
    depends_on:
      - postgres
      - redis
    environment:
      SERVICE_NAME: quality-gate
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src/quality_gate:/app/quality_gate
      - ./src/common:/app/common
      - ./reports:/app/reports
    networks:
      - mlops-network
    restart: "no"  # Don't restart - ephemeral container
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G
        reservations:
          memory: 512M
    profiles:
      - manual  # Only start when explicitly needed (scheduler spawns it)

  # ===================================
  # DATA INGEST: Processing Pipeline
  # ===================================
  # NOTE: This service is EPHEMERAL - spawned by scheduler when needed
  # Do not start manually unless testing
  ingest:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.ingest
    container_name: mlops-ingest
    depends_on:
      - postgres
      - minio
      - redis
    environment:
      SERVICE_NAME: ingest
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src/ingest:/app/ingest
      - ./src/common:/app/common
      - ./data:/app/data
    networks:
      - mlops-network
    restart: "no"  # Don't restart - ephemeral container
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1536M
        reservations:
          memory: 1G
    profiles:
      - manual  # Only start when explicitly needed (scheduler spawns it)

  # ===================================
  # TRAINER: BERTopic Model Training
  # ===================================
  # NOTE: This service is EPHEMERAL - spawned by scheduler when needed
  # Do not start manually unless testing
  trainer:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.trainer
    container_name: mlops-trainer
    depends_on:
      - postgres
      - mlflow
      - minio
      - redis
    environment:
      SERVICE_NAME: trainer
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      MIN_TOPIC_SIZE: ${MIN_TOPIC_SIZE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src/trainer:/app/trainer
      - ./src/common:/app/common
      - ./models:/app/models
      - ./reports:/app/reports
    networks:
      - mlops-network
    restart: "no"  # Don't restart - ephemeral container
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 4G
        reservations:
          memory: 2G
    profiles:
      - manual  # Only start when explicitly needed (scheduler spawns it)
